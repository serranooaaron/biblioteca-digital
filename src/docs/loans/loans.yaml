paths:
  /api/loans/:
    get:
      tags: [Loans]
      summary: Listar préstamos
      responses:
        '200': { description: Préstamos obtenidos correctamente. }
  /api/loans/{lid}:
    get:
      tags: [Loans]
      summary: Consultar un préstamo
      parameters:
        - { in: path, name: lid, required: true, schema: { type: string } }
      responses:
        '200': { description: Préstamo encontrado. }
        '404': { description: Préstamo no encontrado. }
  /api/loans/{uid}/{bid}:
    post:
      tags: [Loans]
      summary: Registrar un préstamo de libro
      parameters:
        - { in: path, name: uid, required: true, schema: { type: string } }
        - { in: path, name: bid, required: true, schema: { type: string } }
      responses:
        '200': { description: Préstamo creado correctamente. }
        '400': { description: El libro ya está prestado. }
        '404': { description: Usuario o libro no encontrado. }
components:
  schemas:
    Loan:
      type: object
      properties:
        _id: { type: string }
        user: { type: string }
        book: { type: string }
        returned: { type: boolean }
        createdAt: { type: string, format: date-time }
