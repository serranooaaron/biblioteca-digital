paths:
  /api/users/:
    get:
      tags:
        - Users
      summary: Obtener todos los usuarios
      description: Devuelve la lista completa de usuarios registrados.
      responses:
        "200":
          description: Usuarios obtenidos correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"
              example:
                status: success
                payload:
                  - _id: 64d2f3d5c0dcf22f1b9db7d1
                    first_name: Ana
                    last_name: García
                    email: ana@example.com
                    password: $2b$10$abc
                    role: user
                    books: []
        "500":
          description: Error interno del servidor.

  /api/users/{uid}:
    get:
      tags:
        - Users
      summary: Obtener un usuario por id
      description: Retorna un usuario según su id.
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: Identificador único del usuario.
      responses:
        "200":
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: User not found
        "500":
          description: Error interno del servidor.

    put:
      tags:
        - Users
      summary: Actualizar un usuario
      description: Actualiza los campos permitidos de un usuario por id.
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: Identificador del usuario a actualizar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
            example:
              first_name: Ana
              last_name: García
              email: ana.nueva@example.com
      responses:
        "200":
          description: Usuario actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
              example:
                status: success
                message: User updated
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: User not found
        "500":
          description: Error interno del servidor.

    delete:
      tags:
        - Users
      summary: Eliminar un usuario
      description: Elimina un usuario según su id.
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: Identificador del usuario a eliminar.
      responses:
        "200":
          description: Usuario eliminado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
              example:
                status: success
                message: User deleted
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: User not found
        "500":
          description: Error interno del servidor.

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: Identificador MongoDB del usuario.
        first_name:
          type: string
          description: Nombre del usuario.
        last_name:
          type: string
          description: Apellido del usuario.
        email:
          type: string
          format: email
          description: Email del usuario.
        password:
          type: string
          description: Password hasheado del usuario.
        role:
          type: string
          description: Rol del usuario.
          default: user
        books:
          type: array
          description: Lista de libros prestados al usuario.
          items:
            type: string
      required:
        - _id
        - first_name
        - last_name
        - email
        - password

    UserUpdateInput:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        password:
          type: string
      description: Campos que pueden actualizarse del usuario.

    UserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: "#/components/schemas/User"

    UsersListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          type: array
          items:
            $ref: "#/components/schemas/User"

    SuccessMessageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: User not found
